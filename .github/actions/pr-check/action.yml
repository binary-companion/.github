name: PR issue link
description: >
  Fails a pull request that mentions an issue without being linked to it (GitHub links only with a closing keyword
  such as Fixes). A pull request that mentions no issue passes. Uses only the token it is given (the automatic
  GITHUB_TOKEN): no secrets, so it is safe in repositories whose contracts forbid them.
inputs:
  token:
    description: The automatic token (github.token).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ github.action_repository }}
        ref: ${{ github.action_ref }}
        path: tracking
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install -r tracking/scripts/tracking/requirements-test.txt
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: python tracking/scripts/tracking/cli.py pr-check --repo "$REPO" --pr "$PR" --body "$PR_BODY" --author "$PR_AUTHOR"
