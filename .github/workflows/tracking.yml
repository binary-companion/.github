# Reusable tracking workflow. A repository calls it from its own workflow (see docs/caller-template.yml).
# It reads the calling repository's .github/tracking.yml for its projects and uses the GitHub App
# (org variable APP_ID, org secret APP_PRIVATE_KEY, passed with `secrets: inherit`) to write to org projects.
#   issues opened          add to the repo's projects, then roll the parent up
#   issues closed/reopened roll the parent up (after the built-in project workflows have moved the status)
#   pull_request           opened / ready for review / reopened: In review. Merged: Done. Both for the linked issues.
#   workflow_run (failed)  CI failed on the default branch: file a bug that references the merge
#   schedule / dispatch    sweep: roll up from every open child (hand-set statuses fire no event)
name: Tracking
on:
  workflow_call:
    inputs:
      tracking-file:
        description: Path of the repository's tracking file, relative to its checkout.
        type: string
        default: .github/tracking.yml
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    # Fork pull requests get no secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: binary-companion/.github
          ref: main
          path: tracking
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tracking/scripts/tracking/requirements-test.txt
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: binary-companion
      - name: Run the tracking command for this event
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRACKING_FILE: ${{ inputs.tracking-file }}
        run: |
          set -euo pipefail
          cli="python tracking/scripts/tracking/cli.py"
          case "$EVENT" in
            issues)
              if [ "$ACTION" = opened ]; then
                $cli add --repo "$REPO" --issue "$ISSUE" --tracking-file "caller/$TRACKING_FILE"
              else
                sleep 30   # let the built-in project workflows move the item first
              fi
              $cli rollup --repo "$REPO" --issue "$ISSUE" ;;
            pull_request)
              if [ "$ACTION" = closed ] && [ "$MERGED" = true ]; then
                $cli pr --repo "$REPO" --pr "$PR" --target "done"
              elif [ "$ACTION" != closed ] && [ "$DRAFT" != true ]; then
                $cli pr --repo "$REPO" --pr "$PR" --target in_review
              fi ;;
            workflow_run)
              if [ "$RUN_CONCLUSION" = failure ] && [ "$RUN_BRANCH" = "$DEFAULT_BRANCH" ]; then
                prn=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' || true)
                $cli ci-bug --repo "$REPO" --sha "$SHA" --run-url "$RUN_URL" ${prn:+--pr "$prn"}
              fi ;;
            schedule|workflow_dispatch)
              $cli sweep --repo "$REPO" ;;
          esac
